server:
  port: 8080

spring:
  application:
    name: receipt-processing-api
  datasource:
    url: jdbc:h2:mem:receiptsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

receipts:
  storage:
    directory: ./data/receipts
